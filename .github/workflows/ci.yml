name: Validate Elven Decks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:unit
      - if: runner.os != 'Windows'
        run: npx puppeteer browsers install chrome --install-deps
      - if: runner.os != 'Windows'
        run: npm run test:lint && npm run test:render && npm run test:preview && npm run test:integration
      - run: npm pack --dry-run
      - if: runner.os != 'Windows'
        run: npm run test:package
